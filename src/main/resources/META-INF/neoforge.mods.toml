modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
[[mixins]]
    config="tabletexpansion.mixins.json"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    description='''
Expands the Create clipboard (tablet) UI to show all entries from all pages
on a single large scrollable page, instead of navigating page by page.
Visual style matches Create's original clipboard design.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.9,)"
    ordering="AFTER"
    side="BOTH"
